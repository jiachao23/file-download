plugins {
	id 'java'
	id 'org.springframework.boot' version '2.7.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

ext {
	poiVersion = '5.2.3'
	mybatisPlusVersion = '3.5.5'
	minioVersion = '8.5.7'
	hutoolVersion = '5.8.23'
}

repositories {
	mavenCentral()
}

dependencies {
	// SpringBoot 核心依赖
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Lombok（简化实体类）
	compileOnly 'org.projectlombok:lombok:1.18.30'
	implementation 'com.alibaba:fastjson:2.0.25'
	implementation 'com.google.guava:guava:32.1.3-jre'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	implementation 'commons-io:commons-io:2.11.0'
	// SpringBoot 基础
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// 数据库
	implementation 'mysql:mysql-connector-java:8.0.33'
	implementation "com.baomidou:mybatis-plus-boot-starter:${mybatisPlusVersion}"
	implementation "org.apache.poi:poi:${poiVersion}"
	implementation "org.apache.poi:poi-ooxml:${poiVersion}"
	implementation "org.apache.poi:poi-ooxml-lite:${poiVersion}"
	implementation 'com.deepoove:poi-tl:1.12.1'
	implementation 'com.alibaba:easyexcel:3.3.2'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.alibaba:easyexcel:3.3.2'

	// 文件存储（MinIO）
	implementation "io.minio:minio:${minioVersion}"

	// 工具类
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	implementation "cn.hutool:hutool-all:${hutoolVersion}"

	// 测试依赖
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'junit:junit:4.13.2'
}

// 构建配置
tasks.named('test') {
	useJUnitPlatform()
}

// 打包配置（生成可执行JAR）
bootJar {
	archiveFileName = 'file-download-server.jar'
	mainClass = 'com.example.demo.DemoApplication'
}
